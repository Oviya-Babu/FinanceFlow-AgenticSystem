# Hardened OPA Configuration for Security Mesh
# Implements: TLS, authentication, policy enforcement, audit logging

services:
  # Default service for policy decisions
  default:
    url: http://localhost:8181
    credentials:
      bearer:
        token: ""  # Use BEARER_TOKEN environment variable

decision_logs:
  # Log all policy decisions for audit
  service: default
  reporting:
    min_delay_seconds: 5
    max_delay_seconds: 10
  batch_size: 100
  partition_name: "default"
  resource: "logs"

status:
  # Status monitoring
  service: default
  partition_name: "default"
  resource: "status"

bundle:
  # Policy bundle configuration
  service: default
  resource: "bundles/default"
  polling:
    min_delay_seconds: 10
    max_delay_seconds: 30
  persistence:
    directory: /data/bundles

# TLS Configuration (when certificates available)
# tls:
#   system:
#     cert_file: /etc/opa/certs/opa.crt
#     key_file: /etc/opa/certs/opa.key
#     ca_cert_file: /etc/opa/certs/ca.crt
#   certs:
#     - files:
#         cert: /etc/opa/certs/client.crt
#         key: /etc/opa/certs/client.key

# Authentication
authentication:
  type: bearer
  token_file: /etc/opa/bearer.token

# Authorization (self-authorization)
authorization:
  allow_default: false
  policies:
    - effect: allow
      rules:
        - equal:
            - input.path
            - ["system", "status"]
      principals:
        - type: internal
    - effect: allow
      rules:
        - equal:
            - input.path
            - ["data"]
      principals:
        - type: bearer_token

# Audit Logging
audit:
  console: true
  events: ["decision", "compile_error"]
  log_level: "debug"

# Policy Compilation
compile:
  strict_builtins: true
  unsafe_builtins: false

# Query Time Limits
query_timeout: "100ms"
query_max_depth: 100

# Server Configuration
server:
  # Strict security settings
  addr: "0.0.0.0:8181"
  read_timeout_seconds: 5
  write_timeout_seconds: 5
  max_header_bytes: 1048576  # 1MB limit
  max_request_body_bytes: 10485760  # 10MB limit

# Logging
logging:
  level: "debug"
  format: "json"
  timestamp_format: "2006-01-02T15:04:05Z07:00"

# Plugins
plugins:
  builtin:
    # Enable built-in plugins
    enabled: true

# Metrics
metrics:
  - provider: prometheus
    options:
      skip_request_path: false
      skip_query_cache: false
      skip_virtual_docs: false
      skip_bundling_metrics: false

# Feature Flags
features:
  # Security features
  strict_policy_compilation: true
  request_headers_log: true
  response_headers_log: true

# Data Masking for sensitive logs
data_masking:
  patterns:
    - field: "password"
      pattern: "***REDACTED***"
    - field: "token"
      pattern: "***REDACTED***"
    - field: "secret"
      pattern: "***REDACTED***"
    - field: "api_key"
      pattern: "***REDACTED***"
