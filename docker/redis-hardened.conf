# Hardened Redis Configuration for Security Mesh
# Implements: ACL, TLS, AOF persistence, security policies

# Network Security
port 6379
bind 127.0.0.1
protected-mode yes

# TLS Configuration (when certificates available)
# tls-port 6380
# tls-cert-file /etc/redis/certs/redis.crt
# tls-key-file /etc/redis/certs/redis.key
# tls-dh-params-file /etc/redis/certs/redis.dh
# tls-ca-cert-file /etc/redis/certs/ca.crt
# tls-protocols "TLSv1.2 TLSv1.3"
# tls-ciphers "HIGH:!aNULL:!MD5"

# Authentication & ACL
# FIX V06: requirepass must NOT be empty.
# The actual password is injected at container start via the
# REDIS_PASSWORD environment variable:
#   redis-server /etc/redis/redis-hardened.conf --requirepass "${REDIS_PASSWORD}"
# If this config is used standalone, override requirepass via CLI arg.
# NEVER leave requirepass blank in production.
requirepass "REPLACE_VIA_ENV_REDIS_PASSWORD"
# ACL configuration will be loaded from separate ACL file
aclfile /etc/redis/users.acl

# Persistence (AOF for security)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 67108864

# AOF security
aof-use-rdb-preamble yes

# RDB Snapshots (disabled in favor of AOF)
save ""
stop-writes-on-bgsave-error yes

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Security: Disable dangerous commands
# WARNING: These commands are disabled in production
# FIX V21: $(date +%s) is a shell construct — Redis parser does NOT execute
# shell expressions.  Use a static opaque string or disable entirely.
rename-command DEBUG ""
rename-command CONFIG "CONFIG_AGENTGUARD_INTERNAL_ONLY"
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SHUTDOWN "SHUTDOWN_AGENTGUARD_ONLY"

# Replication security
# replicaof master_host 6379
replica-read-only yes
replica-serve-stale-data no

# Cluster (if used)
# cluster-enabled yes
# cluster-node-timeout 15000
# cluster-replica-validity-factor 10

# Slowlog for monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 0

# Notify Keyspace Events for monitoring
notify-keyspace-events "AKE"

# Timeout
timeout 0
tcp-keepalive 300

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Client Output Buffer
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Protocol
proto-max-bulk-len 536870912
timeout 0

# LRU
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Active Defragmentation
activedefrag no
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# Module Loading
# loadmodule /usr/lib/redis/modules/mymodule.so

# Enhanced security flags
always-show-logo no
save-empty-keys-in-rdb yes

# Security Audit
security-audit-enabled yes
security-audit-log /var/log/redis/security-audit.log
