---
# Kubernetes Secrets Configuration for AgentGuard
# Implements: Secure credentials management, secrets encryption

apiVersion: v1
kind: Secret
metadata:
  name: agentguard-redis-secrets
  namespace: agentguard
  labels:
    security.level: critical
    secret.type: credentials
type: Opaque
stringData:
  # Redis passwords (use actual strong passwords)
  REDIS_GATEWAY_PASSWORD: "${REDIS_GATEWAY_PASSWORD}"
  REDIS_OPA_PASSWORD: "${REDIS_OPA_PASSWORD}"
  REDIS_MONITORING_PASSWORD: "${REDIS_MONITORING_PASSWORD}"
  REDIS_BACKUP_PASSWORD: "${REDIS_BACKUP_PASSWORD}"
  REDIS_AUDIT_PASSWORD: "${REDIS_AUDIT_PASSWORD}"
  # Connection string for clients
  REDIS_URL: "redis://gateway:${REDIS_GATEWAY_PASSWORD}@redis:6379/0"

---

apiVersion: v1
kind: Secret
metadata:
  name: agentguard-opa-secrets
  namespace: agentguard
  labels:
    security.level: critical
    secret.type: credentials
type: Opaque
stringData:
  # OPA bearer token
  OPA_BEARER_TOKEN: "${OPA_BEARER_TOKEN}"
  # OPA authentication credentials
  OPA_USERNAME: "opa"
  OPA_PASSWORD: "${OPA_PASSWORD}"

---

apiVersion: v1
kind: Secret
metadata:
  name: agentguard-tls-certs
  namespace: agentguard
  labels:
    security.level: critical
    secret.type: certificates
type: kubernetes.io/tls
data:
  # TLS certificates (base64 encoded)
  tls.crt: ${TLS_CERT_BASE64}
  tls.key: ${TLS_KEY_BASE64}
  ca.crt: ${CA_CERT_BASE64}

---

apiVersion: v1
kind: Secret
metadata:
  name: agentguard-oauth-secrets
  namespace: agentguard
  labels:
    security.level: critical
    secret.type: credentials
type: Opaque
stringData:
  # OAuth / JWT signing keys
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRY: "3600"
  
  # OIDC/OAuth provider credentials
  OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID}"
  OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET}"
  OAUTH_PROVIDER_URL: "${OAUTH_PROVIDER_URL}"

---

apiVersion: v1
kind: Secret
metadata:
  name: agentguard-audit-secrets
  namespace: agentguard
  labels:
    security.level: critical
    secret.type: credentials
type: Opaque
stringData:
  # Audit logging credentials
  AUDIT_LOG_ENCRYPTION_KEY: "${AUDIT_LOG_ENCRYPTION_KEY}"
  SIEM_API_KEY: "${SIEM_API_KEY}"
  SIEM_ENDPOINT: "${SIEM_ENDPOINT}"

---

# SecretProviderClass for Azure Key Vault integration
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentguard-azure-keyvault
  namespace: agentguard
spec:
  provider: azure
  parameters:
    usePodIdentity: "true"
    keyVaultName: "${KEY_VAULT_NAME}"
    objects: |
      array:
        - |
          objectName: redis-gateway-password
          objectType: secret
        - |
          objectName: opa-bearer-token
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
        - |
          objectName: tls-cert
          objectType: secret

---

# SecretProviderClass for HashiCorp Vault integration
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentguard-vault
  namespace: agentguard
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.example.com:8200"
    roleName: "agentguard-role"
    secretPath: "secret/data/agentguard"
    objects: |
      - objectName: "redis-password"
        path: "secret/data/agentguard/redis"
        objectType: "secret"
      - objectName: "opa-token"
        path: "secret/data/agentguard/opa"
        objectType: "secret"
      - objectName: "jwt-key"
        path: "secret/data/agentguard/jwt"
        objectType: "secret"

---

# ConfigMap with non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentguard-config
  namespace: agentguard
  labels:
    security.level: critical
data:
  # OPA configuration
  # FIX V25: OPA_ADDR — inside the pod it is fine to bind all interfaces;
  #          the K8s Service/NetworkPolicy controls external exposure.
  #          However: log level must NOT be debug in production (V26).
  OPA_ADDR: "0.0.0.0:8181"
  OPA_LOG_LEVEL: "info"              # FIX V26: was "debug"
  OPA_QUERY_TIMEOUT: "100ms"

  # Redis configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_TIMEOUT: "5"

  # Gateway configuration
  # FIX V27: 0.0.0.0 inside the pod is correct for K8s (Service layer
  #          controls exposure). Documented here for clarity.
  GATEWAY_HOST: "0.0.0.0"           # pod-internal; K8s Service controls exposure
  GATEWAY_PORT: "8000"
  GATEWAY_LOG_LEVEL: "info"
  GATEWAY_CORS_ORIGINS: "https://trusted.example.com"
  
  # Security configuration
  SECURITY_LEVEL: "critical"
  TLS_ENABLED: "true"
  MTLS_ENABLED: "true"
  AUDIT_LOGGING: "true"
  
  # Monitoring
  PROMETHEUS_ENABLED: "true"
  JAEGER_ENABLED: "true"
  JAEGER_ENDPOINT: "http://jaeger:14268/api/traces"

---

# Encryption configuration for etcd (Kubernetes secret storage)
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
      - configmaps
    providers:
      - aescbc:
          keys:
            - name: key1
              secret: "${ENCRYPTION_KEY_BASE64}"
      - identity: {}

---

# Secret rotation CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentguard-secret-rotation
  namespace: agentguard
spec:
  schedule: "0 2 * * 0"  # Weekly at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: agentguard-secret-rotator
          containers:
          - name: secret-rotator
            image: agentguard/secret-rotator:latest
            env:
            - name: VAULT_ADDR
              value: "https://vault.example.com:8200"
            - name: VAULT_ROLE
              value: "agentguard-secret-rotator"
            volumeMounts:
            - name: service-account-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          volumes:
          - name: service-account-token
            projected:
              sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 3600
                  path: token
          restartPolicy: OnFailure
