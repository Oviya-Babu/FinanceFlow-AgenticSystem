version: '3.8'

# Complete AgentGuard-X Monitoring Stack
# Includes: Prometheus, Alertmanager, Grafana
#
# HARDENED 2026-05-27:
#   - All host ports bound to 127.0.0.1 (was 0.0.0.0)
#   - Grafana password from env var (was hardcoded "admin")
#   - Redis password from env var (was hardcoded "changeme")
#   - GF_SECURITY_COOKIE_SECURE controlled by env
#   - agentguard-gateway removed debug reload mode
#
# Usage:
#   cp .env.example .env   # fill in GRAFANA_ADMIN_PASSWORD, REDIS_PASSWORD
#   docker compose -f docker-compose-monitoring.yaml up -d
#
# Access (localhost only after hardening):
#   Prometheus:    http://127.0.0.1:9090
#   Alertmanager:  http://127.0.0.1:9093
#   Grafana:       http://127.0.0.1:3000

services:
  # ========================================================================
  # PROMETHEUS - Metrics Collection & Alerting Rules Engine
  # ========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: agentguard-prometheus
    restart: unless-stopped
    
    # FIX: 127.0.0.1 binding — Prometheus must not be publicly accessible
    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    
    environment:
      - PROMETHEUS_STORAGE_TSDB_RETENTION_SIZE=500MB
      - PROMETHEUS_STORAGE_TSDB_RETENTION_TIME=15d
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=500MB'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    
    labels:
      - "com.example.description=AgentGuard Prometheus Metrics"
    
    networks:
      - agentguard-monitoring
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    depends_on:
      - agentguard-gateway

  # ========================================================================
  # ALERTMANAGER - Alert Routing & Notification
  # ========================================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: agentguard-alertmanager
    restart: unless-stopped
    
    # FIX: 127.0.0.1 binding — Alertmanager webhook receiver must not be public
    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    
    labels:
      - "com.example.description=AgentGuard Alertmanager"
    
    networks:
      - agentguard-monitoring
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========================================================================
  # GRAFANA - Dashboard & Visualization
  # ========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: agentguard-grafana
    restart: unless-stopped
    
    # FIX: 127.0.0.1 binding — Grafana UI must not be publicly accessible
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # FIX: password from env var — was hardcoded "admin"
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel,grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      # FIX: controlled by env — set GF_SECURITY_COOKIE_SECURE=true with HTTPS
      - GF_SECURITY_COOKIE_SECURE=${GF_SECURITY_COOKIE_SECURE:-false}
      - GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION=false
      - GF_LOG_LEVEL=info
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    
    labels:
      - "com.example.description=AgentGuard Grafana Dashboards"
    
    networks:
      - agentguard-monitoring
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    depends_on:
      - prometheus

  # ========================================================================
  # AGENTGUARD GATEWAY - Metrics Producer
  # ========================================================================
  agentguard-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentguard-gateway
    restart: unless-stopped
    
    # FIX: all ports bound to 127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"    # FastAPI Gateway — localhost only
      - "127.0.0.1:8182:8182"    # OPA Server — localhost only
      - "127.0.0.1:6380:6379"    # Redis — localhost only

    environment:
      - PYTHONUNBUFFERED=1
      - OPA_URL=http://opa:8181
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - PROMETHEUS_ENABLED=true
      # Set HOST=0.0.0.0 inside container so Docker networking works;
      # the ports: mapping above enforces the localhost-only host binding.
      - HOST=0.0.0.0

    volumes:
      - ./policies:/app/policies:ro
      - ./app:/app/app:ro

    # FIX: removed --reload — auto-reload is a production security risk
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    
    labels:
      - "com.example.description=AgentGuard Security Gateway"
    
    networks:
      - agentguard-monitoring
      - agentguard-internal
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    depends_on:
      - redis
      - opa

  # ========================================================================
  # OPA - Policy Decision Engine
  # ========================================================================
  opa:
    build:
      context: .
      dockerfile: docker/Dockerfile.opa-hardened
    container_name: agentguard-opa
    restart: unless-stopped
    
    # FIX: 127.0.0.1 binding — OPA policy engine must not be publicly accessible
    ports:
      - "127.0.0.1:8181:8181"

    environment:
      - OPA_LOG_LEVEL=info
      - OPA_DECISION_LOGS=true
    
    volumes:
      - ./policies:/policies:ro
    
    labels:
      - "com.example.description=AgentGuard OPA Policy Engine"
    
    networks:
      - agentguard-internal
    
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Authorization: Bearer secret", "http://localhost:8181/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    security_opt:
      - no-new-privileges:true
    
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    read_only: true
    tmpfs:
      - /tmp

  # ========================================================================
  # REDIS - Session & Rate Limit Storage
  # ========================================================================
  redis:
    build:
      context: .
      dockerfile: docker/Dockerfile.redis-hardened
    container_name: agentguard-redis
    restart: unless-stopped
    
    # FIX: 127.0.0.1 binding for Redis
    ports:
      - "127.0.0.1:6380:6379"

    environment:
      # FIX: password from env var — was hardcoded "changeme"
      - REDIS_PASSWORD=${REDIS_PASSWORD}

    volumes:
      - redis_data:/data
      - ./docker/redis-hardened.conf:/etc/redis/redis.conf:ro
      - ./docker/users.acl:/etc/redis/users.acl:ro

    command: >
      redis-server /etc/redis/redis-hardened.conf
      --requirepass "${REDIS_PASSWORD}"

    labels:
      - "com.example.description=AgentGuard Redis Cache"

    networks:
      - agentguard-internal

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    security_opt:
      - no-new-privileges:true
    
    cap_drop:
      - ALL
    
    read_only: true
    tmpfs:
      - /tmp

networks:
  agentguard-monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
    labels:
      - "com.example.description=AgentGuard Monitoring Stack"

  agentguard-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
    labels:
      - "com.example.description=AgentGuard Internal Services"

volumes:
  prometheus_data:
    driver: local
    labels:
      - "com.example.description=Prometheus Data"
  
  alertmanager_data:
    driver: local
    labels:
      - "com.example.description=Alertmanager Data"
  
  grafana_data:
    driver: local
    labels:
      - "com.example.description=Grafana Data"
  
  redis_data:
    driver: local
    labels:
      - "com.example.description=Redis Persistence"
