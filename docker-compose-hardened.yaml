version: "3.9"

services:
  redis:
    build:
      context: ./docker
      dockerfile: Dockerfile.redis-hardened
    container_name: redis
    hostname: redis
    
    # Security: Restart policy
    restart: on-failure:5
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/redis
    
    # Security: Drop capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: Security options
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    
    # Security: User (non-root)
    user: "redis:redis"
    
    # Networking — FIX V18: localhost-bound only
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - agentguard-net
    expose:
      - "6379"
    
    # Volumes (read-only where possible)
    volumes:
      - redis_data:/data:rw
      - ./docker/redis-hardened.conf:/etc/redis/redis-hardened.conf:ro
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=redis,security=critical"
    
    # Labels for monitoring
    labels:
      security.level: "critical"
      security.scanned: "true"
      monitoring.enabled: "true"

  opa:
    build:
      context: ./docker
      dockerfile: Dockerfile.opa-hardened
      args:
        OPA_VERSION: "0.62.0"
    container_name: opa
    hostname: opa
    
    # Security: Restart policy
    restart: on-failure:5
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp
      - /data
    
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: Security options
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    
    # Security: User (nonroot from distroless)
    user: "65532:65532"
    
    # Networking — FIX V19: localhost-bound only
    ports:
      - "127.0.0.1:8182:8181"
    networks:
      - agentguard-net
    expose:
      - "8181"
    
    # Volumes
    volumes:
      - ./policies:/policies:ro
      - ./docker/opa-hardened.conf:/etc/opa/opa-hardened.conf:ro
      - opa_data:/data:rw
    
    # Environment — FIX V17: OPA_ADDR scoped to localhost; debug → info
    environment:
      OPA_ADDR: "0.0.0.0:8181"          # inside container (Docker net isolated)
      OPA_LOG_LEVEL: "info"              # was "debug" — V17/V26 fix
      OPA_QUERY_TIMEOUT: "100ms"
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=opa,security=critical"
    
    # Labels for monitoring
    labels:
      security.level: "critical"
      security.image: "distroless"
      security.scanned: "true"
      monitoring.enabled: "true"
    
    # Dependencies
    depends_on:
      redis:
        condition: service_healthy

# Networks (isolated)
networks:
  agentguard-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.default_bridge: "false"
      com.docker.driver.mtu: 1500
    ipam:
      config:
        - subnet: 172.28.0.0/16
    labels:
      security.level: "critical"
      network.isolation: "enabled"

# Volumes (persistent data)
volumes:
  redis_data:
    driver: local
    labels:
      security.level: "critical"
      backup.enabled: "true"
  opa_data:
    driver: local
    labels:
      security.level: "critical"
      backup.enabled: "true"
