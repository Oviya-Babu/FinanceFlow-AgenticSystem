################################ REDIS HARDENED CONFIGURATION ###############################
#
# This configuration file implements production-grade security hardening for FinanceFlow.
# Use this with docker-compose for secure local development and enterprise deployment.
#
# SECURITY FEATURES:
# - Localhost-only binding
# - Password authentication required
# - Protected mode enabled
# - Dangerous commands disabled
# - Safe memory policies
# - Persistent storage
#

################################# NETWORK #####################################

# Accept connections only from localhost (127.0.0.1)
# This prevents external access to Redis
bind 127.0.0.1

# Enable protected mode to prevent unauth access even without requirepass
protected-mode yes

# TCP listen port
port 6379

# TCP backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

################################ SECURITY #####################################

# Require password for all operations
# CRITICAL: Change this to a strong password in production
# Use: openssl rand -base64 32
requirepass CHANGE_THIS_TO_SECURE_PASSWORD

# ACL disabled for now (enable in production with redis 6+)
# aclfile /etc/redis/users.acl

# Dangerous command renaming/disabling
# These commands are disabled because they can cause data loss or security issues

# Disable FLUSHALL (delete all data)
rename-command FLUSHALL ""

# Disable FLUSHDB (delete current database)
rename-command FLUSHDB ""

# Disable CONFIG (prevent runtime configuration changes)
rename-command CONFIG ""

# Disable SHUTDOWN (prevent accidental server shutdown)
rename-command SHUTDOWN ""

# Disable DEBUG (prevent debugging output)
rename-command DEBUG ""

# Disable KEYS (prevent key scanning without ACLs)
# Note: KEYS is slow with large datasets, SCAN is preferred
# rename-command KEYS ""

################################## CLIENTS ####################################

# Max number of connected clients (set based on needs)
maxclients 10000

# Timeout for idle clients (seconds, 0 = no timeout)
timeout 0

############################## MEMORY MANAGEMENT ###############################

# Maximum memory Redis can use
# For FinanceFlow: 256MB suitable for development, increase for production
maxmemory 256mb

# Memory eviction policy
# allkeys-lru: Remove any key based on LRU algorithm
# When max memory is reached, evict least recently used keys
maxmemory-policy allkeys-lru

# Memory optimization
# Avoid memory waste from long lists at the cost of some CPU usage
list-compress-depth 0

################################ PERSISTENCE ####################################

# Enable AOF (Append Only File) for durability
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy
# everysec: Balance between speed and durability (recommended)
appendfsync everysec

# No-write fsync
no-appendfsync-on-rewrite no

# Auto AOF rewrite percentage
auto-aof-rewrite-percentage 100

# Auto AOF rewrite min size
auto-aof-rewrite-min-size 64mb

################################ LOGGING #####################################

# Log level: debug, verbose, notice, warning
loglevel notice

# Log output: empty string means STDOUT
logfile ""

# System log: no (use stdout), yes (use syslog)
syslog-enabled no

# Syslog identity
syslog-ident redis

# Syslog facility: USER, LOCAL0-LOCAL7
syslog-facility local0

################################ PERFORMANCE TUNING ###########################

# Database count (0-15)
databases 16

# Save snapshots (RDB)
# save <seconds> <changes>
# Empty save = no snapshots (use AOF instead)
save ""

# Stop writes on save error
stop-writes-on-bgsave-error yes

# Compress RDB file
rdbcompression yes

# RDB checksum
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory
dir ./

################################# REPLICATION #####################################

# For future enterprise setup: slave-read-only yes

#################################### CLUSTER ###################################

# Cluster support: disabled for single-node
# cluster-enabled no

################################ SECURITY RECOMMENDATIONS ########################
#
# For Production Deployment:
#
# 1. TLS/SSL Encryption
#    - Enable tls-port 6380
#    - Provide tls-cert-file and tls-key-file
#    - Use tls-ca-cert-file for mutual TLS
#
# 2. Redis ACLs (Redis 6+)
#    - Enable aclfile with fine-grained permissions
#    - Create user for FinanceFlow with limited commands
#
# 3. Network Security
#    - Use Docker internal networks (no public ports)
#    - Implement firewall rules
#    - Use VPC/security groups in cloud
#
# 4. Monitoring
#    - Enable slowlog logging
#    - Use OpenTelemetry instrumentation
#    - Monitor memory usage
#    - Alert on authentication failures
#
# 5. Backup & Disaster Recovery
#    - Enable both RDB and AOF
#    - Regular backup to secure storage
#    - Test restore procedures
#
# 6. Access Control
#    - Rotate requirepass regularly
#    - Use environment-specific passwords
#    - Never hardcode passwords in code
#
#########################################################################################
